name: SaaS foundation
on: [push, pull_request]
jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/api/requirements-lock.txt
            tests/requirements-lock.txt
      - name: Install media test system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
      - run: pip install -r tests/requirements-lock.txt
      - name: Provision pinned optional midi2hands model
        run: python scripts/fetch_midi2hands_model.py --output tools/midi2hands/model.onnx
      - name: Install web dependencies for cross-language contract tests
        run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - name: Configure real hand-model interpreter
        run: |
          echo "HANDS_MODEL_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          echo "HANDS_MODEL_ARTIFACT=$GITHUB_WORKSPACE/tools/midi2hands/model.onnx" >> "$GITHUB_ENV"
          echo "HANDS_MODEL_ENABLED=true" >> "$GITHUB_ENV"
      - run: python -m pytest
      - run: npm test
        working-directory: apps/web
      - name: Provision pinned Basic Pitch browser model
        run: |
          python -m pip download --no-deps --dest "$RUNNER_TEMP/basic-pitch-package" basic-pitch==0.4.0
          python scripts/fetch_basic_pitch_browser_model.py \
            --source-dir "$RUNNER_TEMP/basic-pitch-package" \
            --output music-candidate-run/basic-pitch-0.4.0/model.onnx
      - run: npm run build
        working-directory: apps/web
      - run: docker build -f infra/docker/Dockerfile -t form-saas:ci .
