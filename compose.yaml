name: form-saas
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: form
      POSTGRES_PASSWORD: form
      POSTGRES_DB: form
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U form -d form"]
      interval: 3s
      timeout: 3s
      retries: 20
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: form-local
      MINIO_ROOT_PASSWORD: local-development-only
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["storage-data:/data"]
  mail:
    image: axllent/mailpit:v1.27.9
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
  migrate:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://form:form@postgres:5432/form
    depends_on:
      postgres:
        condition: service_healthy
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    ports: ["127.0.0.1:8001:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://form:form@postgres:5432/form
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: form
      STORAGE_ADDRESSING_STYLE: path
      STORAGE_ACCESS_KEY: form-local
      STORAGE_SECRET_KEY: local-development-only
      DEMO_ENABLED: "true"
      DEMO_ASSETS_DIR: /demo
    volumes: ["./web/dist/assets:/demo:ro"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gpu
    gpus: all
    volumes:
      - ./models:/app/models:ro
      - ./inputs:/app/inputs:ro
      - ./outputs:/app/outputs
    command: ["python", "scripts/check_environment.py"]
volumes:
  postgres-data:
  storage-data:
