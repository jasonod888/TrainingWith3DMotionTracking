<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar lab · prepared instructor models</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: #0c1116; color: #e6edf3; }
  header { padding: 12px 16px 4px; }
  h1 { margin: 0; font-size: 15px; letter-spacing: .01em; }
  #controls { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 16px 10px; }
  #controls button { min-height: 34px; padding: 6px 12px; border-radius: 8px; border: 1px solid #2c3a46;
    background: #16202a; color: #cfdae4; font: inherit; cursor: pointer; }
  #controls button:hover { border-color: #3f5464; }
  #controls button.on { background: #2c6f5a; border-color: #47a486; color: #f2fffa; }
  #controls .upload { display: inline-flex; align-items: center; gap: 6px; min-height: 34px;
    padding: 6px 12px; border-radius: 8px; border: 1px dashed #3f5464; color: #cfdae4; cursor: pointer; }
  #controls .upload input { display: none; }
  #stage { position: relative; height: 60vh; min-height: 380px; margin: 0 8px; border-radius: 10px; overflow: hidden; background: #11161c; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #status { margin: 8px 16px; color: #9fb0bf; font-size: 12px; }
  #info { margin: 0 16px 24px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  #info dt { color: #7f93a5; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  #info dd { margin: 0 0 8px; font-variant-numeric: tabular-nums; }
  #info pre { margin: 0; padding: 10px; border-radius: 8px; background: #131b23; color: #b8c8d6; overflow-x: auto; font-size: 11px; }
  @media (max-width: 720px) { #info { grid-template-columns: 1fr; } #stage { height: 52vh; } }
</style>
</head>
<body>
<header><h1>Avatar lab · prepared instructor models</h1></header>
<div id="controls" role="group" aria-label="Avatar inspection controls"></div>
<div id="scrub"></div>
<div id="stage"></div>
<p id="status" role="status">Starting…</p>
<div id="info"></div>
<script type="module" src="/src/avatar-lab.ts"></script>
</body>
</html>
